<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body.gate-page { background: #0b0b10; color: #f4f4f6; font: 15px/1.5 Inter, -apple-system, system-ui, sans-serif; display: grid; place-items: center; padding: 20px; -webkit-font-smoothing: antialiased; }
  #gate { width: min(380px, 100%); background: #121218; border: 1px solid #2a2a36; border-radius: 20px; padding: 26px 24px 22px; text-align: center; }
  #gate .logo { font-size: 34px; font-weight: 800; letter-spacing: -0.045em; }
  #gate .logo small { font-size: 13px; font-weight: 600; color: #a9a9b7; letter-spacing: 0; margin-left: 4px; }
  #gate p { color: #a9a9b7; margin: 6px 0 18px; font-size: 14px; }
  #gate input { width: 100%; text-align: center; font: 700 28px Inter, system-ui, sans-serif; letter-spacing: .5em; padding: 12px 0 12px .5em; background: #18181f; color: #f4f4f6; border: 1px solid #2a2a36; border-radius: 14px; outline: none; }
  #gate input:focus { border-color: #ff4fb2; box-shadow: 0 0 0 3px rgba(255, 79, 178, .18); }
  #gate button { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 14px; background: #15301f; color: #4be38c; font: 700 15px Inter, system-ui, sans-serif; cursor: pointer; }
  #gate button:disabled { opacity: .6; cursor: progress; }
  #gate label { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 12px; color: #a9a9b7; font-size: 13px; cursor: pointer; }
  #gate .err { color: #ff6542; min-height: 20px; margin: 10px 0 0; font-size: 13px; }
  #gate .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
  #gate .crew { display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin-top: 22px; }
  #gate .guard { filter: drop-shadow(0 0 3px #ff3fa4) drop-shadow(0 0 9px rgba(255, 63, 164, .55)); }
  #gate .couch { filter: drop-shadow(0 0 3px rgba(155, 92, 255, .8)); }
  #gate .say { font: 8px/1.6 "Press Start 2P", monospace; color: #ffd1ec; margin-top: 10px; }
  #gate svg { display: block; }
</style>

        return;

      if (document.getElementById('remember').checked) {
        try { localStorage.setItem(KEY, JSON.stringify({ salt: P.salt, k: btoa(String.fromCharCode.apply(null, dk)) })); } catch (e) {}
      }
      say.textContent = 'welcome back 💜';
      launch(page);
    } catch (e2) {
      err.textContent = 'This browser can’t unlock it (' + e2.message + ').';
    } finally {
      go.disabled = false; go.textContent = 'Unlock';
    }
  });
})();
</script>
</body>
</html>
