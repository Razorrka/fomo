<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  #gate { width: min(380px, 100%); background: #121218; border: 1px solid #2a2a36; border-radius: 20px; padding: 26px 24px 22px; text-align: center; }

  #gate button:disabled { opacity: .6; cursor: progress; }
  #gate label { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 12px; color: #a9a9b7; font-size: 13px; cursor: pointer; }
  #gate .err { color: #ff6542; min-height: 20px; margin: 10px 0 0; font-size: 13px; }
  #gate .shake { animation: shake .35s; }

  #gate .guard { filter: drop-shadow(0 0 3px #ff3fa4) drop-shadow(0 0 9px rgba(255, 63, 164, .55)); }

  #gate .say { font: 8px/1.6 "Press Start 2P", monospace; color: #ffd1ec; margin-top: 10px; }
  #gate svg { display: block; }

  const KEY = 'fomo-lock-key';
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
