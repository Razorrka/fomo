    data.set(salt); data.set(iv, salt.length); data.set(ct, salt.length + iv.length);
    const mac = await crypto.subtle.importKey('raw', dk.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!(await crypto.subtle.verify('HMAC', mac, b64(P.tag), data))) return null; // wrong code
    const aes = await crypto.subtle.importKey('raw', dk.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aes, ct));
  }
  function launch(page) {
    window.FOMO_GATE = { lock() { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } };
    document.open(); document.write(page); document.close();
  }
  const form = document.getElementById('gate'), pin = document.getElementById('pin'), go = document.getElementById('go'), err = document.getElementById('err'), say = document.getElementById('say');
  // a remembered device opens straight in
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.salt === P.salt) {
      form.style.visibility = 'hidden';
      unseal(b64(saved.k)).then((page) => (page ? launch(page) : (localStorage.removeItem(KEY), (form.style.visibility = 'visible'))));
    }
  } catch (e) {}
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!pin.value) return;
    go.disabled = true; go.textContent = 'Unlocking…'; err.textContent = '';
    try {
      const dk = await derive(pin.value);
      const page = await unseal(dk);
      if (!page) {
        err.textContent = 'Wrong code.'; say.textContent = 'nice try.';
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        pin.value = ''; pin.focus();
        return;
      }
      if (document.getElementById('remember').checked) {
        try { localStorage.setItem(KEY, JSON.stringify({ salt: P.salt, k: btoa(String.fromCharCode.apply(null, dk)) })); } catch (e) {}
      }
      say.textContent = 'welcome back 💜';
      launch(page);
    } catch (e2) {
      err.textContent = 'This browser can’t unlock it (' + e2.message + ').';
    } finally {
      go.disabled = false; go.textContent = 'Unlock';
    }
  });
})();
